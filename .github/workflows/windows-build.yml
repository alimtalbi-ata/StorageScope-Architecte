          }
          if (HasFinding 'nas-low' 'CAPACITY_WARNING') { throw 'Sub-warning capacity rounded into WARNING' }
          if (HasFinding 'nas-low' 'CAPACITY_CRITICAL') { throw 'Sub-warning capacity rounded into CRITICAL' }
          if (-not (HasFinding 'nas-warning' 'CAPACITY_WARNING') -or (HasFinding 'nas-warning' 'CAPACITY_CRITICAL')) { throw 'Sub-critical capacity misclassified' }
          if (-not (HasFinding 'nas-critical' 'CAPACITY_CRITICAL')) { throw 'Exact critical capacity boundary missed' }
          if ((HasFinding 'share-low' 'SHARE_QUOTA_WARNING') -or (HasFinding 'share-low' 'SHARE_QUOTA_CRITICAL')) { throw 'Sub-warning share quota misclassified' }
          if (-not (HasFinding 'share-warning' 'SHARE_QUOTA_WARNING') -or (HasFinding 'share-warning' 'SHARE_QUOTA_CRITICAL')) { throw 'Sub-critical share quota misclassified' }

          # The other NAS in the same snapshot must remain unaffected.
          $malformedInput = Join-Path $env:RUNNER_TEMP 'vendor-malformed-share-v6207.json'
          $malformedOutput = Join-Path $env:RUNNER_TEMP 'vendor-malformed-share-v6207-report.json'

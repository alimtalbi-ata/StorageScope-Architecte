          [IO.File]::WriteAllText($malformedInput, $malformedJson, [Text.UTF8Encoding]::new($false))
          $malformedArgs = @('--vendor-snapshot-file', ('"{0}"' -f $malformedInput), ('"{0}"' -f $malformedOutput))
          $malformedProcess = Start-Process -FilePath $exe -ArgumentList $malformedArgs -Wait -PassThru
          if ($malformedProcess.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $malformedOutput -PathType Leaf)) { throw 'Frozen malformed share CLI failed' }
          $malformedReport = Get-Content -Raw -LiteralPath $malformedOutput | ConvertFrom-Json

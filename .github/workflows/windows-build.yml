name: Build and qualify StorageScope Windows
on:
  workflow_dispatch:
  pull_request:
    # Qualify stacked feature PRs on their exact head, not only legacy base branches.
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Qualify the PR's exact head, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce SQLite pagination fixture closure
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Join-Path (Get-Location).Path '03-Sources')
          $log466 = Join-Path $env:RUNNER_TEMP 'sqlite-fixture-v466.log'
          python -W error::ResourceWarning -X tracemalloc=1 -m unittest discover -s 04-Tests-et-Qualification -p 'test_v466.py' -v 2>&1 | Tee-Object -FilePath $log466
          if ($LASTEXITCODE -ne 0) { throw 'V6.466 pagination tests failed' }
          if (Select-String -Quiet -Path $log466 -Pattern '(?i)ResourceWarning|unclosed database|Exception ignored in:') { throw 'V6.466 fixture leaked a SQLite handle' }
          $log467 = Join-Path $env:RUNNER_TEMP 'sqlite-fixture-v467.log'
          python -W error::ResourceWarning -X tracemalloc=1 -m unittest discover -s 04-Tests-et-Qualification -p 'test_v467.py' -v 2>&1 | Tee-Object -FilePath $log467
          if ($LASTEXITCODE -ne 0) { throw 'V6.467 cursor tests failed' }
          if (Select-String -Quiet -Path $log467 -Pattern '(?i)ResourceWarning|unclosed database|Exception ignored in:') { throw 'V6.467 fixture leaked a SQLite handle' }
      - name: Qualify historical Windows failure taxonomy parser
        shell: pwsh
        run: |
          python -m py_compile tools/classify_windows_regression_log.py
          if ($LASTEXITCODE -ne 0) { throw 'Historical failure taxonomy parser syntax failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_historical_failure_taxonomy_v6236.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Historical failure taxonomy tests failed' }
      - name: Check release sources and binary workspace
        shell: pwsh
        run: |
          $version = (Get-Content -Raw '07-Manifestes/VERSION').Trim()
          if ($version -notmatch '^\d+\.\d+$') { throw 'Invalid release version' }
          if (-not (Test-Path '02-Compilation-Windows/StorageScope.iss')) { throw 'Missing Inno Setup definition' }
          if (-not (Test-Path '02-Compilation-Windows/StorageScope.spec')) { throw 'Missing PyInstaller specification' }
          if (Test-Path (Join-Path 'binary' ('v' + $version))) { throw 'Already published release in source tree' }
      - name: Remove stale qualification evidence
        shell: pwsh
        run: |
          [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() | Set-Content '02-Compilation-Windows/windows-qualification-start.txt'
          foreach ($name in @('windows-qualification-report.json','windows-installer-smoke-report.json','windows-portable-smoke-report.json','windows-release-qualification.json')) {
            $path = Join-Path '02-Compilation-Windows' $name
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force -ErrorAction Stop }
          }
      - name: Build Windows release
        shell: pwsh
        run: |
          $global:LASTEXITCODE = 0
          if (Test-Path '02-Compilation-Windows/build-all-windows.ps1') {
            & './02-Compilation-Windows/build-all-windows.ps1'
          } else {
            & './build-all-windows.ps1'
          }
          if (-not $?) { throw 'Build failed' }
          if ($LASTEXITCODE -ne 0) { throw "Build process returned exit code $LASTEXITCODE" }
      - name: Verify frozen SAN/NAS assessment (positive and fail-closed)
        shell: pwsh
        run: |
          $version = (Get-Content -Raw '07-Manifestes/VERSION').Trim()
          $exe = (Resolve-Path (Join-Path (Join-Path 'binary' ('v' + $version)) 'StorageScope.exe')).Path
          $input = Join-Path $env:RUNNER_TEMP 'storage-risk-valid.json'
          $output = Join-Path $env:RUNNER_TEMP 'storage-risk-report.json'
          $badInput = Join-Path $env:RUNNER_TEMP 'storage-risk-duplicate-key.json'
          $badOutput = Join-Path $env:RUNNER_TEMP 'storage-risk-invalid-report.json'
          $topology = @{
            schema = 'storagescope.storage-topology.v1'
            assets = @(
              @{ id = 'host1'; kind = 'host' },
              @{ id = 'array1'; kind = 'storage_array'; used_gib = 97; total_gib = 100 }
            )
            paths = @(@{ host_id = 'host1'; storage_id = 'array1'; fabric = 'A'; state = 'up' })
            shares = @()
          }
          [IO.File]::WriteAllText($input, ($topology | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
          $args = @('--storage-risk-file', ('"{0}"' -f $input), ('"{0}"' -f $output))
          $process = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen SAN/NAS assessment failed: $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'Frozen SAN/NAS evidence missing' }
          $report = Get-Content -Raw -LiteralPath $output | ConvertFrom-Json
          $codes = @($report.findings | ForEach-Object { $_.code })
          if ($report.schema -ne 'storagescope.storage-risk.v1' -or $report.assessment -ne 'RISKS_FOUND' -or $report.automatic_changes -ne 0) { throw 'Frozen SAN/NAS report contract invalid' }
          if ('CAPACITY_CRITICAL' -notin $codes -or 'SINGLE_ACTIVE_FABRIC' -notin $codes) { throw 'Frozen SAN/NAS risks not detected' }
          $dependencies = $report.dependency_impact
          if ($null -eq $dependencies -or $dependencies.schema -ne 'storagescope.storage-dependencies.v1') { throw 'Frozen dependency report missing' }
          if ($dependencies.verified_host_relationships -ne 1 -or $dependencies.unverified_host_relationships -ne 0 -or $dependencies.automatic_changes -ne 0) { throw 'Frozen host-array dependency evidence invalid' }
          if (@($dependencies.assets).Count -ne 1 -or $dependencies.assets[0].asset_id -ne 'array1') { throw 'Frozen dependency asset scope invalid' }
          [IO.File]::WriteAllText($badInput, '{"schema":"storagescope.storage-topology.v1","assets":[],"assets":[],"paths":[],"shares":[]}', [Text.UTF8Encoding]::new($false))
          $badArgs = @('--storage-risk-file', ('"{0}"' -f $badInput), ('"{0}"' -f $badOutput))
          $rejected = Start-Process -FilePath $exe -ArgumentList $badArgs -Wait -PassThru
          if ($rejected.ExitCode -eq 0 -or (Test-Path -LiteralPath $badOutput)) { throw 'Frozen SAN/NAS parser accepted duplicate JSON property' }
          Write-Host "Frozen SAN/NAS assessment PASS: $($report.finding_count) findings; invalid input rejected"
      - name: Verify frozen SAN path conflict quarantine (up/down/up)
        shell: pwsh
        run: |
          $version = (Get-Content -Raw '07-Manifestes/VERSION').Trim()
          $exe = (Resolve-Path (Join-Path (Join-Path 'binary' ('v' + $version)) 'StorageScope.exe')).Path
          $inputPath = Join-Path $env:RUNNER_TEMP 'storage-path-conflict-v6200.json'
          $outputPath = Join-Path $env:RUNNER_TEMP 'storage-path-conflict-v6200-report.json'
          $topology = @{
            schema = 'storagescope.storage-topology.v1'
            assets = @(
              @{ id = 'host1'; kind = 'host' },
              @{ id = 'array1'; kind = 'storage_array'; used_gib = 20; total_gib = 100 }
            )
            paths = @(
              @{ host_id = 'host1'; storage_id = 'array1'; fabric = 'A'; port = 'p1'; state = 'up' },
              @{ host_id = 'host1'; storage_id = 'array1'; fabric = 'A'; port = 'p1'; state = 'down' },
              @{ host_id = 'host1'; storage_id = 'array1'; fabric = 'A'; port = 'p1'; state = 'up' }
            )
            shares = @()
          }
          [IO.File]::WriteAllText($inputPath, ($topology | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
          $args = @('--storage-risk-file', ('"{0}"' -f $inputPath), ('"{0}"' -f $outputPath))
          $process = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen SAN conflict review failed: $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) { throw 'Frozen conflict evidence missing' }
          $report = Get-Content -Raw -LiteralPath $outputPath | ConvertFrom-Json
          if ($report.assessment -ne 'INCOMPLETE' -or $report.verified_active_paths -ne 0) { throw 'Conflicting path incorrectly verified' }
          if ($report.dependency_impact.verified_host_relationships -ne 0 -or $report.dependency_impact.unverified_host_relationships -ne 1) { throw 'Frozen dependency incorrectly trusted conflicting SAN path' }
          $codes = @($report.findings | ForEach-Object { $_.code })
          if ('CONFLICTING_PATH_STATE' -notin $codes -or 'NO_VERIFIED_ACTIVE_PATH' -notin $codes) { throw 'Frozen SAN conflict findings missing' }
          Write-Host 'Frozen SAN path quarantine PASS: up/down/up remains unverified'
      - name: Verify frozen mixed SAN path evidence V6.211
        shell: pwsh
        run: |
          $version = (Get-Content -Raw '07-Manifestes/VERSION').Trim()
          $exe = (Resolve-Path (Join-Path (Join-Path 'binary' ('v' + $version)) 'StorageScope.exe')).Path
          $input = Join-Path $env:RUNNER_TEMP 'mixed-san-v6211.json'
          $output = Join-Path $env:RUNNER_TEMP 'mixed-san-v6211-report.json'
          # Synthetic: conflicting states on fabric A, independent up path on B.
          # The verified path must NOT erase the unverified path's evidence.
          $raw = '{"schema":"storagescope.storage-topology.v1","assets":[{"id":"h1","kind":"host"},{"id":"a1","kind":"storage_array","used_gib":20,"total_gib":100}],"paths":[{"host_id":"h1","storage_id":"a1","fabric":"A","port":"p1","state":"up"},{"host_id":"h1","storage_id":"a1","fabric":"A","port":"p1","state":"down"},{"host_id":"h1","storage_id":"a1","fabric":"B","port":"p2","state":"up"}],"shares":[]}'
          [IO.File]::WriteAllText($input, $raw, [Text.UTF8Encoding]::new($false))
          $arguments = @('--storage-risk-file', ('"{0}"' -f $input), ('"{0}"' -f $output))
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $output)) { throw 'Frozen mixed SAN review failed' }
          $report = Get-Content -Raw -LiteralPath $output | ConvertFrom-Json
          $dep = $report.dependency_impact
          if ($dep.assessment -ne 'INCOMPLETE' -or $dep.verified_host_relationships -ne 1 -or $dep.unverified_host_relationships -ne 1 -or $dep.mixed_evidence_host_relationships -ne 1 -or $dep.automatic_changes -ne 0) { throw 'Frozen mixed SAN evidence was hidden or misclassified' }
          if ((@($dep.assets[0].mixed_evidence_host_ids) -join ',') -ne 'h1') { throw 'Frozen mixed SAN host traceability missing' }
          Write-Host 'Frozen mixed SAN evidence PASS (synthetic, read-only)'
      - name: Verify frozen missing SAN fabric evidence V6.212
        shell: pwsh
        run: |
          $version = (Get-Content -Raw '07-Manifestes/VERSION').Trim()
          $exe = (Resolve-Path (Join-Path (Join-Path 'binary' ('v' + $version)) 'StorageScope.exe')).Path
          $input = Join-Path $env:RUNNER_TEMP 'missing-san-fabric-v6212.json'
          $output = Join-Path $env:RUNNER_TEMP 'missing-san-fabric-v6212-report.json'
          # Synthetic: one active fabric B and a second path with no fabric ID.
          $raw = '{"schema":"storagescope.storage-topology.v1","assets":[{"id":"h1","kind":"host"},{"id":"a1","kind":"storage_array","used_gib":20,"total_gib":100}],"paths":[{"host_id":"h1","storage_id":"a1","fabric":"B","port":"p2","state":"up"},{"host_id":"h1","storage_id":"a1","state":"up"}],"shares":[]}'
          [IO.File]::WriteAllText($input, $raw, [Text.UTF8Encoding]::new($false))
          $arguments = @('--storage-risk-file', ('"{0}"' -f $input), ('"{0}"' -f $output))
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $output)) { throw 'Frozen missing-fabric SAN review failed' }
          $report = Get-Content -Raw -LiteralPath $output | ConvertFrom-Json
          $dep = $report.dependency_impact
          if ($dep.assessment -ne 'INCOMPLETE' -or $dep.verified_host_relationships -ne 1 -or $dep.unverified_host_relationships -ne 1 -or $dep.mixed_evidence_host_relationships -ne 1 -or $dep.automatic_changes -ne 0) { throw 'Frozen missing-fabric evidence was hidden' }
          if ((@($dep.assets[0].mixed_evidence_host_ids) -join ',') -ne 'h1') { throw 'Frozen missing-fabric host traceability missing' }
          if ('INVALID_PATH' -notin @($report.findings | ForEach-Object { $_.code })) { throw 'Frozen invalid SAN fabric finding missing' }
          Write-Host 'Frozen missing SAN fabric evidence PASS (synthetic, read-only)'
      - name: Verify frozen unresolved SAN path evidence V6.213
        shell: pwsh
        run: |
          $version = (Get-Content -Raw '07-Manifestes/VERSION').Trim()
          $exe = (Resolve-Path (Join-Path (Join-Path 'binary' ('v' + $version)) 'StorageScope.exe')).Path
          $input = Join-Path $env:RUNNER_TEMP 'orphan-san-v6213.json'
          $output = Join-Path $env:RUNNER_TEMP 'orphan-san-v6213-report.json'
          # Synthetic: one trusted host path and one orphan host observation.
          $raw = '{"schema":"storagescope.storage-topology.v1","assets":[{"id":"h1","kind":"host"},{"id":"a1","kind":"storage_array","used_gib":20,"total_gib":100}],"paths":[{"host_id":"h1","storage_id":"a1","fabric":"A","state":"up"},{"host_id":"missing-host","storage_id":"a1","fabric":"B","state":"up"}],"shares":[]}'
          [IO.File]::WriteAllText($input, $raw, [Text.UTF8Encoding]::new($false))
          $arguments = @('--storage-risk-file', ('"{0}"' -f $input), ('"{0}"' -f $output))
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $output)) { throw 'Frozen orphan SAN review failed' }
          $report = Get-Content -Raw -LiteralPath $output | ConvertFrom-Json
          $dep = $report.dependency_impact
          if ($dep.assessment -ne 'INCOMPLETE' -or $dep.verified_host_relationships -ne 1 -or $dep.unresolved_path_observations -ne 1 -or $dep.automatic_changes -ne 0) { throw 'Frozen orphan SAN evidence missing or incorrectly trusted' }
          if ($dep.assets[0].unresolved_path_observations -ne 1) { throw 'Frozen orphan SAN attribution missing' }
          if ('ORPHAN_PATH' -notin @($report.findings | ForEach-Object { $_.code })) { throw 'Frozen orphan SAN finding missing' }
          Write-Host 'Frozen orphan SAN evidence PASS (synthetic, read-only)'
      - name: Verify frozen unresolved NAS share evidence V6.214
        shell: pwsh
        run: |
          $version = (Get-Content -Raw '07-Manifestes/VERSION').Trim()
          $exe = (Resolve-Path (Join-Path (Join-Path 'binary' ('v' + $version)) 'StorageScope.exe')).Path
          $input = Join-Path $env:RUNNER_TEMP 'orphan-nas-v6214.json'
          $output = Join-Path $env:RUNNER_TEMP 'orphan-nas-v6214-report.json'
          # Synthetic: valid NFS, malformed SMB on the same NAS, unknown NAS.
          $raw = '{"schema":"storagescope.storage-topology.v1","assets":[{"id":"n1","kind":"nas","used_gib":10,"total_gib":100}],"paths":[],"shares":[{"id":"good","nas_id":"n1","protocol":"NFS","used_gib":1,"quota_gib":10},{"nas_id":"n1","protocol":"SMB"},{"id":"unknown","nas_id":"missing","protocol":"SMB"}]}'
          [IO.File]::WriteAllText($input, $raw, [Text.UTF8Encoding]::new($false))
          $arguments = @('--storage-risk-file', ('"{0}"' -f $input), ('"{0}"' -f $output))
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $output)) { throw 'Frozen orphan NAS review failed' }
          $report = Get-Content -Raw -LiteralPath $output | ConvertFrom-Json
          $dep = $report.dependency_impact
          if ($dep.assessment -ne 'INCOMPLETE' -or $dep.unresolved_share_observations -ne 2 -or $dep.verified_share_relationships -ne 1 -or $dep.automatic_changes -ne 0) { throw 'Frozen orphan NAS evidence missing or incorrectly trusted' }
          if ($dep.assets[0].unresolved_share_observations -ne 1 -or (@($dep.assets[0].verified_share_ids) -join ',') -ne 'good') { throw 'Frozen orphan NAS attribution invalid' }
          if ('INVALID_SHARE' -notin @($report.findings | ForEach-Object { $_.code })) { throw 'Frozen orphan NAS risk finding missing' }
          Write-Host 'Frozen orphan NAS evidence PASS (synthetic, read-only)'
      - name: Verify frozen timestamp provenance and quarantine V6.215
        shell: pwsh
        run: |
          $version = (Get-Content -Raw '07-Manifestes/VERSION').Trim()
          $exe = (Resolve-Path (Join-Path (Join-Path 'binary' ('v' + $version)) 'StorageScope.exe')).Path
          $input = Join-Path $env:RUNNER_TEMP 'timestamp-v6215.json'
          $output = Join-Path $env:RUNNER_TEMP 'timestamp-v6215-report.json'
          # Synthetic: independent valid SAN path and invalid-time SAN observation.
          $raw = '{"schema":"storagescope.storage-topology.v1","assets":[{"id":"h1","kind":"host"},{"id":"a1","kind":"storage_array","used_gib":20,"total_gib":100}],"paths":[{"host_id":"h1","storage_id":"a1","fabric":"A","state":"up","observed_at":"2026-10-24T12:00:00+02:00"},{"host_id":"h1","storage_id":"a1","fabric":"B","state":"up","observed_at":"2026-10-24T12:00:00"}],"shares":[]}'
          [IO.File]::WriteAllText($input, $raw, [Text.UTF8Encoding]::new($false))
          $arguments = @('--storage-risk-file', ('"{0}"' -f $input), ('"{0}"' -f $output))
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $output)) { throw 'Frozen timestamp review failed' }
          $report = Get-Content -Raw -LiteralPath $output | ConvertFrom-Json
          $dep = $report.dependency_impact
          $times = $dep.observation_times
          if ($dep.assessment -ne 'INCOMPLETE' -or $dep.verified_host_relationships -ne 1 -or $dep.unverified_host_relationships -ne 1 -or $dep.mixed_evidence_host_relationships -ne 1 -or $dep.automatic_changes -ne 0) { throw 'Frozen timestamp quarantine failed' }
          if ($times.valid_observations -ne 1 -or $times.invalid_observations -ne 1 -or $times.latest_parsed_utc -ne '2026-10-24T10:00:00Z' -or $times.freshness -ne 'NOT_ASSESSED') { throw 'Frozen timestamp provenance invalid' }
          if ('INVALID_PATH_TIMESTAMP' -notin @($report.findings | ForEach-Object { $_.code })) { throw 'Frozen timestamp finding absent' }
          Write-Host 'Frozen SAN/NAS timestamp provenance PASS (synthetic, read-only)'
      - name: Verify frozen SAN/NAS freshness policy V6.216
        shell: pwsh
        run: |
          $version = (Get-Content -Raw '07-Manifestes/VERSION').Trim()
          $exe = (Resolve-Path (Join-Path (Join-Path 'binary' ('v' + $version)) 'StorageScope.exe')).Path
          $input = Join-Path $env:RUNNER_TEMP 'freshness-v6216.json'
          $output = Join-Path $env:RUNNER_TEMP 'freshness-v6216-report.json'
          # Synthetic: fresh fabric A, stale fabric B, future-dated NAS share.
          $raw = '{"schema":"storagescope.storage-topology.v1","freshness_policy":{"schema":"storagescope.observation-freshness-policy.v1","reference_time":"2026-10-24T10:00:00Z","max_age_seconds":120,"max_future_skew_seconds":5},"assets":[{"id":"h1","kind":"host"},{"id":"a1","kind":"storage_array","used_gib":20,"total_gib":100},{"id":"n1","kind":"nas","used_gib":20,"total_gib":100}],"paths":[{"host_id":"h1","storage_id":"a1","fabric":"A","state":"up","observed_at":"2026-10-24T09:59:00Z"},{"host_id":"h1","storage_id":"a1","fabric":"B","state":"up","observed_at":"2026-10-24T09:57:59Z"}],"shares":[{"id":"s1","nas_id":"n1","protocol":"NFS","used_gib":1,"quota_gib":10,"observed_at":"2026-10-24T10:00:06Z"}]}'
          [IO.File]::WriteAllText($input, $raw, [Text.UTF8Encoding]::new($false))
          $arguments = @('--storage-risk-file', ('"{0}"' -f $input), ('"{0}"' -f $output))
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $output)) { throw 'Frozen freshness review failed' }
          $report = Get-Content -Raw -LiteralPath $output | ConvertFrom-Json
          $dep = $report.dependency_impact
          $fresh = $dep.freshness_evaluation
          if ($dep.assessment -ne 'INCOMPLETE' -or $dep.verified_host_relationships -ne 1 -or $dep.unverified_host_relationships -ne 1 -or $dep.mixed_evidence_host_relationships -ne 1 -or $dep.verified_share_relationships -ne 0 -or $dep.automatic_changes -ne 0) { throw 'Frozen freshness quarantine contract failed' }
          if ($fresh.fresh_observations -ne 1 -or $fresh.stale_observations -ne 1 -or $fresh.future_observations -ne 1 -or $fresh.trust -ne 'UNAUTHENTICATED_INPUT_CLOCK') { throw 'Frozen freshness counters invalid' }
          $codes = @($report.findings | ForEach-Object { $_.code })
          if ('PATH_STALE_OBSERVATION' -notin $codes -or 'SHARE_FUTURE_OBSERVATION' -notin $codes) { throw 'Frozen freshness findings missing' }
          Write-Host 'Frozen SAN/NAS freshness policy PASS (synthetic, read-only)'
      - name: Verify frozen CMDB review (provenance and fail-closed)
        shell: pwsh
        run: |
          $version = (Get-Content -Raw '07-Manifestes/VERSION').Trim()
          $exe = (Resolve-Path (Join-Path (Join-Path 'binary' ('v' + $version)) 'StorageScope.exe')).Path
          $input = Join-Path $env:RUNNER_TEMP 'cmdb-review-valid.json'
          $output = Join-Path $env:RUNNER_TEMP 'cmdb-review-report.json'
          $badInput = Join-Path $env:RUNNER_TEMP 'cmdb-review-duplicate.json'
          $badOutput = Join-Path $env:RUNNER_TEMP 'cmdb-review-invalid-report.json'
          $records = @(
            @{ source = 'NetApp'; serial = 'S1'; wwn = '5001' },
            @{ source = 'CMDB'; serial = 'S1'; wwn = '5002' }
          )
          [IO.File]::WriteAllText($input, (ConvertTo-Json -InputObject $records -Depth 8), [Text.UTF8Encoding]::new($false))
          $args = @('--cmdb-review-file', ('"{0}"' -f $input), ('"{0}"' -f $output))
          $process = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen CMDB review failed: $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'Frozen CMDB evidence missing' }
          $report = Get-Content -Raw -LiteralPath $output | ConvertFrom-Json
          if ($report.assessment -ne 'INCOMPLETE' -or $report.candidate_count -ne 1 -or $report.automatic_merges -ne 0 -or $report.destructive_changes -ne 0) { throw 'Frozen CMDB report contract invalid' }
          if (@($report.quarantined_indices).Count -ne 2 -or $report.candidates[0].action -ne 'QUARANTINE_IDENTITY_CONFLICT') { throw 'Frozen CMDB conflict quarantine absent' }
          $sourceBytes = [IO.File]::ReadAllBytes($input)
          $expectedDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($sourceBytes)).ToLowerInvariant()
          if ($report.snapshot_sha256 -ne $expectedDigest -or $report.snapshot_size_bytes -ne $sourceBytes.Length) { throw 'Frozen CMDB snapshot exact-byte SHA256 evidence invalid' }
          [IO.File]::WriteAllText($badInput, '[{"source":"a","source":"b","serial":"S"}]', [Text.UTF8Encoding]::new($false))
          $badArgs = @('--cmdb-review-file', ('"{0}"' -f $badInput), ('"{0}"' -f $badOutput))
          $rejected = Start-Process -FilePath $exe -ArgumentList $badArgs -Wait -PassThru
          if ($rejected.ExitCode -eq 0 -or (Test-Path -LiteralPath $badOutput)) { throw 'Frozen CMDB parser accepted duplicate JSON property' }
          Write-Host 'Frozen CMDB provenance and conflict review PASS'
      - name: Verify frozen CMDB duplicate-source quarantine V6.228
        shell: pwsh
        run: |
          $version = (Get-Content -Raw '07-Manifestes/VERSION').Trim()

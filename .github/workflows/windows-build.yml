          $quotaSnapshot = @{ schema = 'storagescope.vendor-snapshot.v1'; vendor = 'netapp_ontap'; source_ref = 'synthetic-v6206'; collected_at = '2026-10-24T01:00:00Z'; systems = @($quotaSystem) }

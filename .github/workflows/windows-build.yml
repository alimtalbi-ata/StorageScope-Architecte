          if (@($quotaReport.quarantined_share_asset_ids).Count -ne 1 -or $quotaReport.quarantined_share_asset_ids[0] -ne 'netapp_ontap:SN-QUOTA') { throw 'Frozen unique quota quarantine identity missing' }
          if (-not (@($quotaReport.rejected) | Where-Object { $_ -match 'inconsistent quota' })) { throw 'Frozen unique quota rejection reason missing' }
          $quotaHash = (Get-FileHash -LiteralPath $quotaInput -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($quotaReport.snapshot_sha256 -ne $quotaHash) { throw 'Frozen unique quota snapshot digest mismatch' }

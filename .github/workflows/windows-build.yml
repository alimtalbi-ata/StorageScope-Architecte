            $before = (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash
            $repeated = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
            $after = (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash

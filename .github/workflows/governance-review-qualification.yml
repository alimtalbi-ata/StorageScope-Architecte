name: Governance review qualification
on:
  push:
    branches: [feature/audit-coherence-review-20261020]
  pull_request:
    paths:
      - '03-Sources/**'
      - '04-Tests-et-Qualification/**'
      - '.github/workflows/governance-review-qualification.yml'
  workflow_dispatch:
jobs:
  review-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the PR exact head, not the synthetic merge checkout.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce SQLite pagination fixture closure
        env:
          PYTHONPATH: 03-Sources
          PYTHONTRACEMALLOC: '1'
        run: |
          python -W error::ResourceWarning -m unittest discover -s 04-Tests-et-Qualification -p 'test_v466.py' -v 2>&1 | tee "$RUNNER_TEMP/sqlite-fixture-v466.log"
          if grep -Eiq 'ResourceWarning|unclosed database|Exception ignored in:' "$RUNNER_TEMP/sqlite-fixture-v466.log"; then echo "V6.466 fixture leaked a SQLite handle"; exit 1; fi
          python -W error::ResourceWarning -m unittest discover -s 04-Tests-et-Qualification -p 'test_v467.py' -v 2>&1 | tee "$RUNNER_TEMP/sqlite-fixture-v467.log"
          if grep -Eiq 'ResourceWarning|unclosed database|Exception ignored in:' "$RUNNER_TEMP/sqlite-fixture-v467.log"; then echo "V6.467 fixture leaked a SQLite handle"; exit 1; fi
      - name: Qualify audit and multi-vendor review
        run: |
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_review_registry_v622.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_review_registry_integrity_v687.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_inventory_review_e2e_v688.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_path_risk_v6194.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_risk_desktop_v6196.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_inventory_reconcile_v619.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_inventory_reconcile_provenance_v6197.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_review_desktop_v6198.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_snapshot_digest_v6208.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_transitive_quarantine_v6209.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_asset_kind_quarantine_v6210.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_same_source_duplicate_v6228.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_cli_evidence_parity_v6229.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_identity_types_v6231.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_invalid_identity_links_v6232.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_transitive_source_duplicate_v6233.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_collector_provenance_v6235.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_manufacturer_identity_v6230.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_dependency_impact_v6199.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_path_quarantine_v6200.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_dependency_missing_fabric_v6212.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_dependency_orphan_paths_v6213.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_dependency_orphan_shares_v6214.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_observation_time_v6215.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_observation_freshness_v6216.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_capacity_threshold_precision_v6217.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_source_allowlist_v6218.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_observation_auth_v6219.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_observation_replay_v6220.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_key_rotation_v6221.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_historical_failure_taxonomy_v6236.py' -v
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_historical_failure_taxonomy_v6237.py' -v
  review-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the PR exact head, not the synthetic merge checkout.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce SQLite pagination fixture closure
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Join-Path (Get-Location).Path '03-Sources')
          $log466 = Join-Path $env:RUNNER_TEMP 'sqlite-fixture-v466.log'
          python -W error::ResourceWarning -X tracemalloc=1 -m unittest discover -s 04-Tests-et-Qualification -p 'test_v466.py' -v 2>&1 | Tee-Object -FilePath $log466
          if ($LASTEXITCODE -ne 0) { throw 'V6.466 pagination tests failed' }
          if (Select-String -Quiet -Path $log466 -Pattern '(?i)ResourceWarning|unclosed database|Exception ignored in:') { throw 'V6.466 fixture leaked a SQLite handle' }
          $log467 = Join-Path $env:RUNNER_TEMP 'sqlite-fixture-v467.log'
          python -W error::ResourceWarning -X tracemalloc=1 -m unittest discover -s 04-Tests-et-Qualification -p 'test_v467.py' -v 2>&1 | Tee-Object -FilePath $log467
          if ($LASTEXITCODE -ne 0) { throw 'V6.467 cursor tests failed' }
          if (Select-String -Quiet -Path $log467 -Pattern '(?i)ResourceWarning|unclosed database|Exception ignored in:') { throw 'V6.467 fixture leaked a SQLite handle' }
      - name: Qualify Windows review logic
        shell: pwsh
        run: |
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_review_registry_v622.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Registry tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_review_registry_integrity_v687.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Integrity tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_inventory_review_e2e_v688.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Inventory E2E failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_path_risk_v6194.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Storage path risk tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_risk_desktop_v6196.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Desktop storage risk tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_inventory_reconcile_v619.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Historical CMDB reconciliation tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_inventory_reconcile_provenance_v6197.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CMDB provenance regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_review_desktop_v6198.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CMDB desktop review regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_snapshot_digest_v6208.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CMDB exact-byte SHA256 provenance regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_transitive_quarantine_v6209.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CMDB transitive identity quarantine regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_asset_kind_quarantine_v6210.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CMDB asset kind quarantine regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_same_source_duplicate_v6228.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CMDB same-source duplicate quarantine regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_cli_evidence_parity_v6229.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CMDB CLI evidence parity regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_identity_types_v6231.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CMDB strict identity type regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_invalid_identity_links_v6232.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CMDB invalid identity link regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_transitive_source_duplicate_v6233.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CMDB transitive duplicate-source regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_collector_provenance_v6235.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CMDB collector provenance regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_cmdb_manufacturer_identity_v6230.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CMDB manufacturer identity regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_dependency_impact_v6199.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Storage dependency impact regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_path_quarantine_v6200.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'SAN path quarantine regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_dependency_missing_fabric_v6212.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Missing SAN fabric evidence regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_dependency_orphan_paths_v6213.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Unresolved SAN path evidence regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_dependency_orphan_shares_v6214.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Unresolved NAS share evidence regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_observation_time_v6215.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'SAN/NAS timestamp provenance regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_observation_freshness_v6216.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'SAN/NAS freshness policy regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_capacity_threshold_precision_v6217.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'SAN/NAS capacity threshold precision regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_source_allowlist_v6218.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'SAN/NAS source allowlist regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_observation_auth_v6219.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'SAN/NAS HMAC authentication regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_observation_replay_v6220.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'SAN/NAS signed replay quarantine regression tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_storage_key_rotation_v6221.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'SAN/NAS HMAC key rotation regression tests failed' }
          python -m py_compile tools/classify_windows_regression_log.py
          if ($LASTEXITCODE -ne 0) { throw 'Historical Windows failure taxonomy script syntax failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_historical_failure_taxonomy_v6236.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Historical Windows failure taxonomy tests failed' }
          python -m unittest discover -s 04-Tests-et-Qualification -p 'test_historical_failure_taxonomy_v6237.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'V6.237 fail-closed taxonomy summary tests failed' }
